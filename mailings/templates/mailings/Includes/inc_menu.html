<header class="navbar navbar-expand-lg navbar-light bg-white fixed-top shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="{% url 'mailings:mailing_list' %}">
            💌 Сервис рассылок
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav"
                aria-expanded="false" aria-label="Переключить навигацию">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'mailings:mailing_create' %}">Создать рассылку</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'mailings:message_create' %}">Добавить сообщение</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'mailings:client_create' %}">Добавить клиента</a>
                </li>
            </ul>

            <ul class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                    <li class="nav-item">
                        <span class="navbar-text me-2">👋 Привет, {{ user.username }}!</span>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-danger" href="{% url 'users:logout' %}">Выйти</a>
                    </li>
                {% else %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'users:login' %}">Войти</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'users:register' %}">Регистрация</a>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>
</header>
