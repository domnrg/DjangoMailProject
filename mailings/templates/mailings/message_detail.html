{% extends 'mailings/base.html' %}

{% block title %}Просмотр сообщения{% endblock %}

{% block content %}
<div class="container mt-4">
  <h2>Сообщение №{{ object.id }}</h2>

  <div class="card mt-3">
    <div class="card-body">
      <h5 class="card-title">{{ object.subject }}</h5>
      <p class="card-text">{{ object.body }}</p>
    </div>
  </div>

  <div class="mt-3">
    <a href="{% url 'mailings:message_update' object.id %}" class="btn btn-primary">Редактировать</a>
    <a href="{% url 'mailings:message_delete' object.id %}" class="btn btn-danger">Удалить</a>
    <a href="{% url 'mailings:message_list' %}" class="btn btn-secondary">Назад к списку</a>
  </div>
</div>
{% endblock %}
