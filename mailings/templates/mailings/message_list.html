{% extends 'mailings/base.html' %}
{% block title %}Сообщения{% endblock %}
{% block content %}
<h2 class="mb-4">Сообщения</h2>
<a class="btn btn-success mb-3" href="{% url 'mailings:message_create' %}">Добавить сообщение</a>

{% if object_list %}
<ul class="list-group">
    {% for message in object_list %}
        <li class="list-group-item">
            <a href="{% url 'mailings:message_detail' message.pk %}">{{ message.subject }}</a>
        </li>
    {% endfor %}
</ul>
{% else %}
<p>Пока нет сообщений.</p>
{% endif %}
{% endblock %}
